name: FractalLens
options:
  bundleIdPrefix: studio.fractal
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UIUserInterfaceStyle: Light
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
targets:
  FractalLens:
    type: application
    platform: iOS
    sources:
      - path: FractalLens
        excludes: [Resources]
      - path: FractalLens/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.fractal.lens
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Fractal
        INFOPLIST_KEY_NSCameraUsageDescription: Discover repeating shapes and structures in the world around you using a live, on-device lens.
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  FractalLensTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FractalLensTests]
    dependencies:
      - target: FractalLens
  FractalLensUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FractalLensUITests]
    dependencies:
      - target: FractalLens
schemes:
  FractalLens:
    build:
      targets:
        FractalLens: all
    test:
      targets: [FractalLensTests, FractalLensUITests]
